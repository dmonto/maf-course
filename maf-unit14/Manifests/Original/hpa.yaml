apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: maf-status
  namespace: maf-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: maf-status
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
